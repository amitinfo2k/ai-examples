[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap_analyzer"
version = "0.1.0"
description = "5G Core PCAP Analysis PoC for Success/Failure Classification"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "scapy>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "pyshark>=0.4.3",
    "python-json-logger>=2.0.7",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "asn1tools>=0.146.0",
]

[project.scripts]
pcap-analyzer = "pcap_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["pcap_analyzer*"]
exclude = ["data*", "models*", "results*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
