# PIPELINE DEFINITION
# Name: rag-pipeline-for-tcpdump-analysis
# Description: A pipeline that processes tcpdump data, stores embeddings in ChromaDB, and performs RAG-based analysis.
# Inputs:
#    analysis_query: str [Default: 'Detect any anomalies in the network traffic']
#    collection_name: str [Default: 'tcpdump_collection']
#    input_pcap: str [Default: '/mnt/pcap/sample.pcap']
#    pvc_name: str [Default: 'pcap-storage']
components:
  comp-embed-and-store:
    executorLabel: exec-embed-and-store
    inputDefinitions:
      artifacts:
        input_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        collection_name:
          parameterType: STRING
  comp-parse-tcpdump:
    executorLabel: exec-parse-tcpdump
    inputDefinitions:
      parameters:
        input_pcap:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-rag-analysis:
    executorLabel: exec-rag-analysis
    inputDefinitions:
      parameters:
        collection_name:
          parameterType: STRING
        query:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_analysis:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-embed-and-store:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - embed_and_store
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.9.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef embed_and_store(\n    input_text: Input[Artifact],\n    collection_name:\
          \ str\n):\n    import chromadb\n    from sentence_transformers import SentenceTransformer\n\
          \n    # Connect to ChromaDB service in the cluster using v2 API\n    client\
          \ = chromadb.HttpClient(\n        host='chroma-service.chromedb.svc.cluster.local',\
          \  # Updated namespace to chromedb\n        port=8000,  # Default ChromaDB\
          \ HTTP port; adjust if needed\n        ssl=False,\n        headers={\"x-chroma-client-version\"\
          : \"2.0.0\"}\n    )\n\n    # Get or create collection with v2 API\n    try:\n\
          \        collection = client.get_collection(name=collection_name)\n    except\
          \ ValueError:\n        # Collection doesn't exist, create it\n        collection\
          \ = client.create_collection(name=collection_name)\n\n    # Load embedding\
          \ model\n    model = SentenceTransformer('all-MiniLM-L6-v2')\n\n    # Read\
          \ packet summaries\n    with open(input_text.path, 'r') as f:\n        texts\
          \ = [line.strip() for line in f.readlines() if line.strip()]\n\n    # Generate\
          \ embeddings\n    embeddings = model.encode(texts).tolist()\n\n    # Add\
          \ to ChromaDB\n    collection.add(\n        documents=texts,\n        embeddings=embeddings,\n\
          \        ids=[f'pkt_{i}' for i in range(len(texts))]\n    )\n\n"
        image: amitinfo2k/pcap-pipeline:3.10
        imagePullPolicy: IfNotPresent
    exec-parse-tcpdump:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - parse_tcpdump
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.9.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'scapy' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef parse_tcpdump(\n    input_pcap: str,\n    output_text: Output[Artifact]\n\
          ):\n    from scapy.all import rdpcap\n\n    # Read the pcap file\n    packets\
          \ = rdpcap(input_pcap)\n\n    # Generate text summaries for each packet\n\
          \    summaries = [pkt.summary() for pkt in packets]\n\n    # Write summaries\
          \ to output artifact\n    with open(output_text.path, 'w') as f:\n     \
          \   f.write('\\n'.join(summaries))\n\n"
        image: amitinfo2k/pcap-pipeline:3.10
        imagePullPolicy: IfNotPresent
    exec-rag-analysis:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - rag_analysis
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.9.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'google-generativeai'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef rag_analysis(\n    collection_name: str,\n    query: str,\n \
          \   output_analysis: Output[Artifact]\n):\n    import chromadb\n    from\
          \ sentence_transformers import SentenceTransformer\n    import google.generativeai\
          \ as genai\n    import os\n\n    # Configure Gemini API key (assume it's\
          \ set as env var or secret)\n    genai.configure(api_key=os.getenv('GEMINI_API_KEY'))\n\
          \n    # Connect to ChromaDB service using v2 API\n    client = chromadb.HttpClient(\n\
          \        host='chroma-service.chromedb.svc.cluster.local',  # Updated namespace\
          \ to chromedb\n        port=8000,\n        ssl=False,\n        headers={\"\
          x-chroma-client-version\": \"2.0.0\"}\n    )\n\n    # Get collection with\
          \ v2 API\n    try:\n        collection = client.get_collection(name=collection_name)\n\
          \    except ValueError:\n        raise ValueError(f\"Collection '{collection_name}'\
          \ does not exist\")\n\n    # Load embedding model\n    model = SentenceTransformer('all-MiniLM-L6-v2')\n\
          \n    # Embed query\n    query_embedding = model.encode(query).tolist()\n\
          \n    # Retrieve top relevant documents\n    results = collection.query(\n\
          \        query_embeddings=[query_embedding],\n        n_results=5\n    )\n\
          \n    # Build context from retrieved documents\n    context = '\\n'.join(results['documents'][0])\n\
          \n    # RAG prompt\n    prompt = f\"Analyze the network traffic based on\
          \ this context:\\n{context}\\n\\nQuery: {query}\\nAnalysis:\"\n\n    # Generate\
          \ response using Gemini (placeholder model; adjust as needed, e.g., 'gemini-1.5-flash')\n\
          \    gemini_model = genai.GenerativeModel('gemini-1.5-flash')\n    response\
          \ = gemini_model.generate_content(\n        prompt,\n        generation_config=genai.types.GenerationConfig(\n\
          \            max_output_tokens=300,\n            temperature=0.7\n     \
          \   )\n    )\n\n    # Write analysis to output\n    with open(output_analysis.path,\
          \ 'w') as f:\n        f.write(response.text.strip())\n\n"
        image: amitinfo2k/pcap-pipeline:3.10
        imagePullPolicy: IfNotPresent
pipelineInfo:
  description: A pipeline that processes tcpdump data, stores embeddings in ChromaDB,
    and performs RAG-based analysis.
  name: rag-pipeline-for-tcpdump-analysis
root:
  dag:
    tasks:
      embed-and-store:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-embed-and-store
        dependentTasks:
        - parse-tcpdump
        inputs:
          artifacts:
            input_text:
              taskOutputArtifact:
                outputArtifactKey: output_text
                producerTask: parse-tcpdump
          parameters:
            collection_name:
              componentInputParameter: collection_name
        taskInfo:
          name: embed-and-store
      parse-tcpdump:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-parse-tcpdump
        inputs:
          parameters:
            input_pcap:
              componentInputParameter: input_pcap
        taskInfo:
          name: parse-tcpdump
      rag-analysis:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-rag-analysis
        dependentTasks:
        - embed-and-store
        inputs:
          parameters:
            collection_name:
              componentInputParameter: collection_name
            query:
              componentInputParameter: analysis_query
        taskInfo:
          name: rag-analysis
  inputDefinitions:
    parameters:
      analysis_query:
        defaultValue: Detect any anomalies in the network traffic
        isOptional: true
        parameterType: STRING
      collection_name:
        defaultValue: tcpdump_collection
        isOptional: true
        parameterType: STRING
      input_pcap:
        defaultValue: /mnt/pcap/sample.pcap
        isOptional: true
        parameterType: STRING
      pvc_name:
        defaultValue: pcap-storage
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.9.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-embed-and-store:
          imagePullPolicy: IfNotPresent
        exec-parse-tcpdump:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - componentInputParameter: pvc_name
            mountPath: /mnt/pcap
        exec-rag-analysis:
          imagePullPolicy: IfNotPresent
