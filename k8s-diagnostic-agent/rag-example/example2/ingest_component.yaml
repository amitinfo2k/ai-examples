name: Ingest tcpdump Data
description: Loads tcpdump logs, creates embeddings, and stores them in ChromaDB.

inputs:
- name: data_dir
  type: String
  description: 'Path to the directory containing the tcpdump data.'

implementation:
  container:
    image: python:3.10
    command:
    - sh
    - -ec
    - |
      pip install "langchain==0.1.16" "chromadb==0.4.24" "sentence-transformers==2.2.2" "unstructured==0.13.2"
      python /app/ingest_logic.py --data-dir "$0"
    - {inputValue: data_dir}
