apiVersion: apps/v1
kind: Deployment
metadata:
  name: jolt-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jolt-orchestrator
  template:
    metadata:
      labels:
        app: jolt-orchestrator
    spec:
      containers:
      - name: orchestrator
        image: jolt-orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: jolt-config
        - secretRef:
            name: jolt-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: jolt-orchestrator
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: jolt-orchestrator
