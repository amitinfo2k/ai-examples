apiVersion: apps/v1
kind: Deployment
metadata:
  name: jolt-validator
  namespace: jolt-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jolt-validator
  template:
    metadata:
      labels:
        app: jolt-validator
    spec:
      containers:
      - name: jolt-validator
        image: jolt-validator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: jolt-platform-config
        - secretRef:
            name: jolt-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jolt-validator-service
  namespace: jolt-platform
spec:
  selector:
    app: jolt-validator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
