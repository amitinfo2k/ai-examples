apiVersion: apps/v1
kind: Deployment
metadata:
  name: jolt-frontend
  namespace: jolt-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jolt-frontend
  template:
    metadata:
      labels:
        app: jolt-frontend
    spec:
      containers:
      - name: jolt-frontend
        image: jolt-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: jolt-platform-config
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jolt-frontend-service
  namespace: jolt-platform
spec:
  selector:
    app: jolt-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
