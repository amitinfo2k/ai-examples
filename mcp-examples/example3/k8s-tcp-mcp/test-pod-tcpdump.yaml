apiVersion: v1
kind: Pod
metadata:
  name: tcpdump-pod
  labels:
    app: tcpdump
spec:
  containers:
  - name: network-troubleshooter
    image: nicolaka/netshoot:latest
    securityContext:
      # Grant the NET_RAW capability, which allows tcpdump to capture packets.
      # This is more secure than running in privileged mode.
      capabilities:
        add:
        - NET_RAW
    command: ["/bin/sh", "-c"]
    # Run a command to keep the container alive.
    # You will use 'kubectl exec' to run tcpdump interactively.
    args:
    - while true; do echo "Ready to capture traffic..."; sleep 3600; done;